app = "bytecraft-botozap-mcp"
primary_region = "gru"

kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.mcp"

[deploy]
  # As sessoes MCP sao stateful e ainda vivem na memoria de uma unica Machine.
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  BOTOZAP_API_URL = "https://botozap.com.br/api/v1"
  BOTOZAP_MCP_TRANSPORT = "streamable-http"
  BOTOZAP_MCP_HOST = "0.0.0.0"
  BOTOZAP_MCP_PORT = "3001"
  BOTOZAP_MCP_ALLOWED_HOSTS = "mcp.botozap.com.br"
  BOTOZAP_MCP_RATE_LIMIT_PER_CLIENT = "120"
  BOTOZAP_MCP_RATE_LIMIT_GLOBAL = "1200"
  BOTOZAP_MCP_TRUSTED_PROXY_CIDRS = "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 75
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "always"
